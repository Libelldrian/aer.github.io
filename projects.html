---
layout: page
title: Projects
---
<section class="list">
    {% assign project_posts = site.posts | where: "projects", true | sort: "title" %}
{% for post in project_posts %}
    {% if post.hidden != true %}
        <div class="item {% if post.star %}star{% endif %}">
            <a class="url" href="{{ site.url }}{{ post.url }}">
                <h3 class="title">{{ post.title }}</h3>
            </a>
        </div>
    {% endif %}
{% endfor %}

</section>
